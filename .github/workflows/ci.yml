name: ci
on: [push, pull_request]

jobs:
  linux:
    # Full build: portable core + ptrace runtime + live guest tests.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++-14 ninja-build
      - run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=g++-14
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  macos:
    # macos-15 runners are arm64, so this builds the FULL macOS target:
    # src/run_darwin.cpp and all of runtime/darwin/ (see the APPLE branch in
    # CMakeLists.txt). That matters -- it is the only automated check that the
    # HVF backend still compiles, since hv_vm_create is entitlement-gated and
    # cannot actually run a partition on a hosted runner. The live hypervisor
    # path is verified locally; this job guards the code from bit-rotting.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_CXX_COMPILER=clang++
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure

  sanitizers:
    # ASan + UBSan over the whole suite, including the live ptrace guests.
    #
    # This codebase is the kind that hides UB from a warning flag: it pokes
    # guest memory through PTRACE_PEEKDATA, writes raw ABI structs into
    # another process's address space, and hand-manages an fd table and an
    # interval map. UBSan earns its place as much as ASan -- abi/wire shifts
    # and masks guest values constantly, and a signed shift or misaligned
    # load is exactly the fault that passes on x86-64 and breaks on aarch64.
    #
    # detect_leaks is left ON: a leak in the trap loop is a real bug, since
    # the loop services millions of syscalls in one run.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++-14 ninja-build
      - run: >-
          cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=g++-14
          -DLX_SANITIZE=address,undefined
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          ASAN_OPTIONS: detect_leaks=1

  windows:
    # Portable core + the WHP backend's offline half.
    #
    # GitHub's Windows runners are themselves VMs WITHOUT nested
    # virtualization, so no WHP partition can be created there. That is
    # exactly why tests/test_whp.cpp is split: the translation and
    # page-table-walk checks run here and guard the logic most likely to
    # break silently, while the live partition checks SKIP rather than fail.
    # The job therefore proves the backend COMPILES and its logic is correct
    # on every push; the hardware path is verified locally and by
    # `linuxity --check` on a real machine.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - shell: msys2 {0}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - shell: msys2 {0}
        run: cmake --build build
      - shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure
      - name: report backend availability
        shell: msys2 {0}
        # Expected to report "no hypervisor" on a CI runner; it must exit
        # cleanly with a real diagnostic rather than crashing in the loader.
        run: ./build/linuxity.exe --check || true
